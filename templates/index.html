
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classificador de Chamados - P0</title>
</head>
<body>

    <h1>Classificador de Chamados</h1>

    <p>Descreva abaixo o problema que deseja registrar:</p>

    <form method="POST" action="/classificar">

        <textarea
            name="chamado"
            rows="6"
            cols="60"
            placeholder="Descreva seu problema..."
            required
        ></textarea>

        <br><br>

        <button type="submit">Enviar chamado</button>

    </form>

</body>
</html>
